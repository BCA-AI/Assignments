<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Club</title>
</head>
<body>
    <header>
        <h1>College Coding Club</h1>
        <p>Learn, build, and grow together.</p>
    </header>

    <nav>
        <a href="#about">About</a> |
        <a href="#gallery">Gallery</a> |
        <a href="#register">Registration</a> |
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="about">
            <h2>About Our Club</h2>
            <p>Our club helps students practise coding and work together on projects.</p>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <img src="https://placehold.co/180x100" alt="Club activity sample image">
            <img src="https://placehold.co/180x100" alt="Coding event sample image">
        </section>

        <section id="register">
            <h2>Join the Club</h2>
            <form>
                <label for="studentname">Name:</label>
                <input type="text" id="studentname" name="studentname" required>
                <br><br>

                <label for="studentemail">Email:</label>
                <input type="email" id="studentemail" name="studentemail" required>
                <br><br>

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer id="contact">
        <h2>Contact</h2>
        <p>Email: codingclub@example.com</p>
    </footer>
</body>
</html>
